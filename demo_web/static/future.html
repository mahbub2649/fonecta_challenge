<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14198c">
<title>Future plans</title>
<link rel="stylesheet" href="/mobile.css">
<style>
  .concept { flex: none; padding: 8px 14px; font-size: 13px; font-weight: 600; text-align: center; color: var(--warn); background: var(--warn-soft); }
  .tabs { flex: none; display: flex; gap: 6px; padding: 10px 12px 0; }
  .tabs button { flex: 1; min-height: 44px; padding: 6px 10px; font-size: 14px; font-weight: 600; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 12px; }
  .tabs button.on { color: #fff; background: var(--brand); border-color: var(--brand); }
  .card { margin-bottom: 10px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; animation: rise .25s ease-out; }
  .card h2 { margin: 0 0 6px; font-size: 18px; line-height: 1.25; }
  .card p { margin: 0 0 8px; }
  .quiet { color: var(--muted); font-size: 14px; }
  .said { font-size: 18px; font-weight: 600; }
  .en { display: block; margin-top: 2px; font-size: 13px; font-style: italic; font-weight: 400; color: var(--muted); }
  .row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); }
  .row b { flex: 1 1 100%; }
  .was { color: var(--muted); }
  .now { font-size: 18px; font-weight: 700; color: var(--brand); }
  .mic { display: grid; place-items: center; width: 92px; height: 92px; margin: 18px auto; font-size: 34px; color: #fff; background: var(--brand); border: 0; border-radius: 50%; box-shadow: 0 8px 24px rgb(20 25 140 / 30%); }
  .wave { display: flex; align-items: center; justify-content: center; gap: 5px; height: 54px; margin: 12px 0; }
  .wave i { width: 6px; height: 14px; background: var(--brand); border-radius: 3px; animation: wave 1s infinite ease-in-out; }
  .wave i:nth-child(2) { animation-delay: .12s; } .wave i:nth-child(3) { animation-delay: .24s; } .wave i:nth-child(4) { animation-delay: .36s; } .wave i:nth-child(5) { animation-delay: .48s; }
  .step { display: block; width: 100%; min-height: 48px; margin-top: 8px; font-weight: 700; color: #fff; background: var(--brand); border: 0; border-radius: 12px; }
  .step.soft { color: var(--brand); background: var(--brand-soft); }
  .places { margin: 8px 0 0; padding: 0; list-style: none; }
  .places li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  .ok { font-weight: 600; color: var(--good); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .stats div { padding: 10px 6px; text-align: center; background: var(--page); border-radius: 12px; }
  .stats b { display: block; font-size: 24px; line-height: 1.1; color: var(--brand); }
  .stats small { font-size: 12px; color: var(--muted); }
  .shops { margin: 8px 0 0; padding: 0; list-style: none; }
  .shops li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .tag { flex: none; padding: 3px 9px; font-size: 12px; font-weight: 600; border-radius: 999px; color: var(--brand); background: var(--brand-soft); }
  .tag.done { color: var(--good); background: var(--good-soft); }
  .tag.off { color: var(--muted); background: var(--page); }
  @keyframes wave { 0%, 100% { height: 14px; } 50% { height: 46px; } }
  @media (prefers-reduced-motion: reduce) { .wave i { height: 30px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="/future.js"></script>
</body>
</html>
