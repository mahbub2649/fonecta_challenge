<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connect Suggests</title>
<style>
  :root { color-scheme: light; --brand: #14198c; --ink: #17202e; --muted: #5b6678; --line: #dde2ea; --bad: #a3231d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #f4f6f9; color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: min(380px, 100%); padding: 28px; background: #fff; border: 1px solid var(--line); border-radius: 18px; }
  h1 { margin: 0 0 4px; font-size: 24px; color: var(--brand); }
  p { margin: 0 0 18px; color: var(--muted); }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  input { width: 100%; padding: 12px; font: inherit; border: 1px solid var(--line); border-radius: 10px; }
  button { width: 100%; margin-top: 12px; padding: 12px; font: inherit; font-weight: 700; color: #fff; background: var(--brand); border: 0; border-radius: 10px; cursor: pointer; }
  .error { margin: 12px 0 0; color: var(--bad); }
</style>
</head>
<body>
<form id="login">
  <h1>Connect Suggests</h1>
  <p>Hackathon demo with synthetic businesses. It writes to a mock only.</p>
  <label for="passcode">Demo passcode</label>
  <input id="passcode" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Open the demo</button>
  <p id="error" class="error" role="alert" hidden></p>
</form>
<script>
  document.getElementById("login").addEventListener("submit", async (event) => {
    event.preventDefault();
    const error = document.getElementById("error");
    error.hidden = true;
    try {
      const response = await fetch("/login", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({passcode: document.getElementById("passcode").value})});
      if (response.ok) { location.reload(); return; }
      error.textContent = (await response.json()).error;
    } catch { error.textContent = "Couldn't reach the demo. Try again."; }
    error.hidden = false;
  });
</script>
</body>
</html>
